            "heading": "Bien travailler avec l’IA.",
            "options": {
              "headingSize": "medium",
              "headingFormat": "simple"
            },
            "paragraph_1": "<p>L’IA peut vous aider à accélérer certaines étapes de votre travail. Elle ne remplace toutefois ni votre jugement ni votre responsabilité. Pour l’utiliser correctement, adoptez quatre réflexes : protéger les données, vérifier les réponses, choisir l’outil adapté et garder l’humain dans la boucle.</p>",

              {
                "id": "item-1",
                "content": "<p>Protégez les données : utilisez uniquement un environnement d’IA approuvé par l’organisation pour les informations de l’entreprise.</p>"
              },
              {
                "id": "item-2",
                "content": "<p>Vérifiez les réponses : une réponse claire et convaincante peut contenir une erreur ou une information inventée.</p>"
              },
              {
                "id": "item-3",
                "content": "<p>Choisissez le bon outil : adaptez le modèle ou l’outil au type de tâche à réaliser.</p>"
              },

                "content": "<p>Gardez l’humain dans la boucle : validez le résultat et prenez vous-même la décision finale.</p>"

        {
          "originalId": "c4d7a1cc-eed5-46b6-96fb-707eea513904",
          "title": "Le bon environnement compte.",
          "type": "text",
          "variant": "heading_with_paragraph",
          "content": {

              "backgroundType": "LIGHT",
              "backgroundColor": "",
              "contentMaxWidth": 3
            },
            "heading": "Le bon environnement compte.",
            "options": {
              "headingSize": "medium",
              "headingFormat": "simple"
            },
            "paragraph_1": "<p>Pour traiter des informations de l’organisation, utilisez Microsoft 365/Copilot fourni par celle-ci, lorsque cet environnement est approuvé pour la tâche. Dans ce contexte, l’environnement d’entreprise est configuré selon les exigences internes de sécurité et de résidence des données au Canada. Votre compte personnel d’un service d’IA n’est pas un raccourci acceptable pour les données de l’organisation.</p>",
            "paragraph_2": ""
          },
          "custom_layout_id": null,

          "id": "b6"

          "title": "Accordion",
          "type": "accordion",

          "content": {
            "items": [
              {
                "title": "Compte d’entreprise approuvé",
                "content": "<p>C’est l’environnement fourni ou autorisé par l’organisation pour le travail. Utilisez-le selon les règles internes et les autorisations applicables, notamment lorsque vous devez traiter des informations liées à des clients, à des employés ou à des projets.</p>"
              },
              {
                "title": "Compte personnel",
                "content": "<p>C’est un compte que vous utilisez à titre individuel sur un service d’IA. Même si l’outil est pratique ou performant, ne copiez-y pas de renseignements confidentiels, personnels, nominatifs ou non publics de l’organisation.</p>"
              },
              {
                "title": "Informations à protéger",
                "content": "<p>Ne transmettez pas à un outil non autorisé un nom de client ou d’employé, une adresse courriel personnelle, un numéro de téléphone, une adresse, un dossier d’employé, des informations financières, des données contractuelles ou un document interne confidentiel.</p>"
              }
            ],

            "heading": "Une réponse plausible n’est pas une preuve.",
            "options": {
              "headingSize": "medium",
              "headingFormat": "simple"
            },
            "paragraph_1": "<p>Une hallucination est une information générée par l’IA qui semble crédible, mais qui est fausse, inventée ou mal interprétée. Une réponse professionnelle peut donc contenir une règle inexistante, une date incorrecte ou une référence qui ne correspond pas au document original.</p>",
            "paragraph_2": ""

          "content": {
            "items": [
              {
                "title": "Source originale",
                "content": "<p>Retournez au document, à la politique ou à la page officielle à l’origine de l’information. Vérifiez que la règle citée existe réellement et qu’elle s’applique bien à votre situation.</p>"
              },
              {
                "title": "Chiffres et dates",
                "content": "<p>Comparez les montants, pourcentages, dates et échéances avec une source fiable. Une seule valeur erronée peut modifier la conclusion d’un résumé ou d’une recommandation.</p>"
              },
              {
                "title": "Noms et références",
                "content": "<p>Vérifiez les noms de personnes, de politiques, de lois, de clients et de documents. Une référence précise en apparence peut avoir été inventée ou associée au mauvais sujet.</p>"
              },
              {
                "title": "Sources fiables",
                "content": "<p>Lorsque la fonction est disponible, demandez à l’IA d’indiquer ses sources. Utilisez ensuite ces références pour effectuer votre propre vérification; une citation fournie par l’IA n’est pas automatiquement exacte.</p>"
              }

          "title": "Accordion",
          "type": "accordion",
          "variant": "accordion",
          "content": {
            "items": [
              {
                "title": "Le rôle de l’agent spécialisé",
                "content": "<p>Un agent spécialisé travaille selon une mission, des instructions, des sources autorisées, des règles métier, une méthode et un format de sortie définis. Il aide à organiser et à préparer le travail; il ne remplace pas votre jugement.</p>"
              },
              {
                "title": "Ce que vous pouvez lui confier",
                "content": "<p>Vous pouvez lui demander de regrouper les informations, de repérer les thèmes récurrents, de signaler les éléments à vérifier, de demander les renseignements manquants et de produire une première version du rapport.</p>"
              },
              {
                "title": "Ce qui reste sous votre responsabilité",
                "content": "<p>Vous devez contrôler les données utilisées, examiner les éléments signalés, confirmer que les sources sont appropriées et valider la version finale avant de la transmettre ou de l’utiliser.</p>"
              },
              {
                "title": "Exemple d’instruction structurée",
                "content": "<p>Mission : préparer une première synthèse mensuelle. Sources : documents autorisés du mois. Méthode : classer les événements, repérer les suivis et signaler les données manquantes. Sortie : rapport préliminaire organisé selon le format attendu.</p>"
              }
            ],

                "title": "<p>Vous devez préparer un rapport mensuel à partir de plusieurs sources autorisées. Un agent peut organiser les informations et produire une première synthèse. Quelle façon de travailler respecte le mieux les responsabilités de chacun?</p>",

                "title": "<p>Vous devez préparer un rapport mensuel à partir de documents internes, de données contractuelles et d’un graphique. Vous envisagez d’utiliser votre compte personnel, puis de demander à l’IA de produire directement la version finale. Quelle démarche applique le mieux les bons réflexes?</p>",

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = base + 'index.css';
        document.head.appendChild(css);

        var vendor = document.createElement('script');
        vendor.type = 'module';
        vendor.crossOrigin = 'anonymous';
        vendor.src = base + 'vendor.js';
        document.head.appendChild(vendor);
        
        var main = document.createElement('script');
        main.type = 'module';

        main.src = base + 'index.js';
