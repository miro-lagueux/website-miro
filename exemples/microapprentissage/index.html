            "duration": 42.370563,
            "settings": {
              "completionMode": "completed"
            },
            "showSpeed": false,
            "showTitle": true,
            "transcript": "<p>Dans cette leçon, nous allons découvrir les bons réflexes à adopter pour utiliser l’intelligence artificielle au travail. </p><p></p><p>L’objectif n’est pas simplement d’apprendre à utiliser un outil d’IA, mais surtout de savoir comment l’utiliser de façon sécuritaire, responsable et efficace. Nous verrons quatre réflexes essentiels qui vous aideront à mieux protéger l’information, à évaluer les réponses produites par l’IA et à utiliser le bon outil selon la situation. </p><p></p><p>Et surtout, nous verrons pourquoi la responsabilité humaine demeure essentielle. L’IA peut vous assister et accélérer votre travail, mais c’est toujours à vous de valider le résultat et de prendre la décision finale. Commençons par les quatre réflexes à adopter dès le premier jour.</p>",

            },
            "caption": "<p></p>",
            "mediaId": "366ed4ac-7909-4316-be68-ef3790ef46fb",
            "autoplay": true,
            "duration": 54.282438,
            "settings": {
              "completionMode": "completed"
            },
            "showSpeed": false,
            "showTitle": true,
            "transcript": "<p><strong>Premier réflexe : protégez les données.</strong></p><p>Lorsque vous travaillez avec des informations de l’entreprise, utilisez uniquement les outils et les environnements d’intelligence artificielle approuvés par votre organisation.</p><p></p><p><strong>Deuxième réflexe : vérifiez les réponses.</strong></p><p>Une réponse générée par l’IA peut sembler claire, précise et convaincante… tout en contenant une erreur ou même une information inventée. Prenez donc toujours le temps de valider les éléments importants.</p><p></p><p><strong>Troisième réflexe : choisissez le bon outil.</strong></p><p>Tous les outils d’intelligence artificielle n’ont pas les mêmes forces. Le bon choix dépend de la tâche à accomplir : rédiger, résumer, analyser, rechercher de l’information ou générer du contenu.</p><p></p><p><strong>Et quatrième réflexe : gardez l’humain dans la boucle.</strong></p><p>L’IA peut vous aider à produire ou à analyser de l’information, mais c’est à vous de valider le résultat et de prendre la décision finale.</p>",
            "showProgress": true,
            "showTranscript": true,
            "showVisualization": false
          },
          "custom_layout_id": null,
          "position": 1,
          "id": "b9"
        },

            "items": [
              {
                "id": "item-1",
                "content": "<p>Protégez les données : utilisez uniquement un environnement d’IA approuvé par l’organisation pour les informations de l’entreprise.</p>"
              },
              {
                "id": "item-2",
                "content": "<p>Vérifiez les réponses : une réponse claire et convaincante peut contenir une erreur ou une information inventée.</p>"
              },
              {
                "id": "item-3",
                "content": "<p>Choisissez le bon outil : adaptez le modèle ou l’outil au type de tâche à réaliser.</p>"
              },
              {
                "id": "item-4",
                "content": "<p>Gardez l’humain dans la boucle : validez le résultat et prenez vous-même la décision finale.</p>"

            "loop": false,
            "title": "Protégez les données",
            "format": {
              "gap": 24,
              "width": 100,
              "textAlign": "start",

              "paddingTop": 32,
              "accentColor": "",
              "paddingBottom": 32,
              "paddingLinked": true,
              "backgroundType": "GRAY",
              "backgroundColor": "",
              "contentMaxWidth": 3
            },
            "caption": "<p></p>",
            "mediaId": "42a70c47-e404-4dbd-ab02-a38095dd9e9f",
            "autoplay": true,
            "duration": 75.728938,
            "settings": {
              "completionMode": "completed"
            },
            "showSpeed": false,
            "showTitle": true,
            "transcript": "<p>Lorsque vous utilisez l’intelligence artificielle au travail, un premier réflexe est essentiel : <strong>protéger les données de l’entreprise</strong>.</p><p></p><p>Et pour cela, l’environnement que vous utilisez est important. Si vous travaillez avec des informations de votre organisation, utilisez uniquement un environnement d’intelligence artificielle approuvé par celle-ci, comme Microsoft 365 Copilot, lorsqu’il est autorisé pour la tâche que vous réalisez.</p><p></p><p><strong>Pourquoi?</strong></p><p>Parce qu’un environnement d’entreprise peut être configuré selon les exigences de sécurité, de confidentialité et de gestion des données de votre organisation. Un compte personnel, même s’il donne accès à un outil d’intelligence artificielle que vous connaissez bien, n’offre pas nécessairement les mêmes protections.</p><p></p><p>Prenons un exemple. Vous devez résumer un document interne contenant des renseignements sur un projet en cours. Copier ce document dans votre compte personnel d’un service d’IA peut exposer des informations qui ne devraient jamais quitter l’environnement approuvé par votre entreprise.Le bon réflexe est donc simple : <strong>données de l’entreprise, environnement approuvé par l’entreprise</strong>.</p><p></p><p>Et si vous avez un doute? Ne copiez pas l’information. Vérifiez d’abord quel outil est autorisé.Dans la suite, nous allons voir plus précisément quels types d’informations nécessitent cette vigilance.</p>",
            "showProgress": true,
            "showTranscript": true,
            "showVisualization": false
          },
          "custom_layout_id": null,
          "position": 1,
          "id": "b15"
        },

          "content": {
            "items": [
              {
                "title": "Compte d’entreprise approuvé",
                "content": "<p>C’est l’environnement fourni ou autorisé par l’organisation pour le travail. Utilisez-le selon les règles internes et les autorisations applicables, notamment lorsque vous devez traiter des informations liées à des clients, à des employés ou à des projets.</p>"
              },
              {
                "title": "Compte personnel",
                "content": "<p>C’est un compte que vous utilisez à titre individuel sur un service d’IA. Même si l’outil est pratique ou performant, ne copiez-y pas de renseignements confidentiels, personnels, nominatifs ou non publics de l’organisation.</p>"
              },
              {
                "title": "Informations à protéger",
                "content": "<p>Ne transmettez pas à un outil non autorisé un nom de client ou d’employé, une adresse courriel personnelle, un numéro de téléphone, une adresse, un dossier d’employé, des informations financières, des données contractuelles ou un document interne confidentiel.</p>"
              }

    <script>
      (function() {
        // Detect if running from local file system (file://) which blocks ES modules due to CORS
        var isFileProtocol = window.location.protocol === 'file:';
        // Use local assets for HTTP/HTTPS, CDN for file:// protocol
        var cdnBase = 'https://preview.scormstack.io/embed/runtime/v0.5/assets/';
        var localBase = './assets/';
        var base = isFileProtocol ? cdnBase : localBase;
        
        if (isFileProtocol) {
          console.log('📁 Running from file:// protocol - using CDN for runtime assets');
        } else {
          console.log('🌐 Running from ' + window.location.protocol + ' - using local assets');
        }
        
        // Load CSS
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = base + 'index.css';
        document.head.appendChild(css);
        
        // Load JS modules in order (vendor first, then index)
        var vendor = document.createElement('script');
        vendor.type = 'module';
        vendor.crossOrigin = 'anonymous';
        vendor.src = base + 'vendor.js';
        document.head.appendChild(vendor);
        
        var main = document.createElement('script');
        main.type = 'module';
        main.crossOrigin = 'anonymous';
        main.src = base + 'index.js';
        document.head.appendChild(main);
      })();
    </script>
